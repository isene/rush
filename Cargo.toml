[package]
name = "rush"
version = "0.1.4"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "A fast terminal shell with vim-style keybindings, nick aliases, and syntax highlighting"
license = "Unlicense"
repository = "https://github.com/isene/rush"

[dependencies]
crossterm = "0.28"
nix = { version = "0.29", features = ["signal", "process", "fs"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
glob = "0.3"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
